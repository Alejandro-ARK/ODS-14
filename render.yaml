# Blueprint de Render: crea la base PostgreSQL, el Redis (Key Value) y el servicio web de una sola vez.
databases:
  - name: mision-oceano-db
    plan: free
    databaseName: mision_oceano
    user: mision_oceano

services:
  # Redis para la capa de canales del reto en vivo (difunde cada pregunta a todos los celulares).
  - type: keyvalue
    name: mision-oceano-redis
    plan: free
    maxmemoryPolicy: noeviction   # los mensajes de Channels no se deben descartar
    ipAllowList: []               # solo accesible desde servicios de Render (red privada)

  - type: web
    name: mision-oceano
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Daphne (ASGI) sirve las páginas normales Y los WebSockets del reto en vivo.
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mision-oceano-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mision-oceano-redis
          property: connectionString
      # Administrador inicial (la contraseña la escribes tú en el panel de Render)
      - key: DJANGO_SUPERUSER_CORREO
        sync: false
      - key: DJANGO_SUPERUSER_NOMBRE
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
