{% if pagina.has_other_pages %}
<nav class="mt-3" aria-label="Páginas">
  <ul class="pagination justify-content-center mb-0">
    {% if pagina.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if filtros_url %}{{ filtros_url }}&{% endif %}page={{ pagina.previous_page_number }}">&laquo;</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if filtros_url %}{{ filtros_url }}&{% endif %}page={{ pagina.next_page_number }}">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
